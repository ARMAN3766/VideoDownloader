name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply update bundles
        run: |
          for z in update.zip account.zip; do
            if [ -f "$z" ]; then unzip -o "$z"; fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secret
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "KS_PASS secret is missing"; exit 1; fi
          if [ ! -f signing/release.jks ]; then echo "signing/release.jks is missing"; exit 1; fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_PROJECT: ${{ secrets.FB_PROJECT }}
        run: |
          gradle assembleRelease --console=plain -PversionCode=${{ github.run_number }} -PversionName=2.1.${{ github.run_number }} > build.log 2>&1 || { grep -E "^e: |What went wrong|error:" -A3 build.log | head -80; exit 1; }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VideoDownloader-2.1.${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: VideoDownloader-2.1.${{ github.run_number }}.apk
